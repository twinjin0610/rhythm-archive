<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>율동 연습 — 구분동작</title>
<meta name="description" content="율동 연습용 구분동작 영상">
<style>
  :root{
    --bg:#0a0c0f; --panel:#111418; --panel2:#181c22; --line:#242a32;
    --txt:#e8edf4; --sub:#8e9aab; --dim:#5d6878; --acc:#ffd038;
    --sel:#5ce1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:'NanumSquareRound','NanumSquare',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 20px 140px}

  header{padding:44px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .eyebrow{color:var(--acc);font-size:12px;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
  h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
  .sub{color:var(--sub);font-size:14px}

  .parts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
  .pbtn{
    text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:14px 16px;cursor:pointer;font-family:inherit;color:var(--sub);transition:.16s;
    display:flex;align-items:center;gap:13px;
  }
  .pbtn:hover{border-color:#333b45}
  .pbtn .big{font-size:25px;font-weight:800;color:var(--dim);line-height:1;font-variant-numeric:tabular-nums}
  .pbtn .pt{font-weight:800;font-size:15px;color:var(--sub);display:block}
  .pbtn .pm{font-size:11.5px;color:var(--dim);margin-top:1px;display:block}
  .pbtn.on{background:rgba(255,208,56,.07);border-color:var(--acc)}
  .pbtn.on .big{color:var(--acc)}
  .pbtn.on .pt{color:var(--txt)}

  .player{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:10px 0 12px;margin:0 -20px 16px;padding-left:20px;padding-right:20px;
    border-bottom:1px solid var(--line);
  }
  .pmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px}
  .pmeta .now{font-weight:800;font-size:14px;color:var(--acc)}
  .pmeta .nm{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  video{width:100%;display:block;background:#000;aspect-ratio:16/9;border-radius:9px}

  .bar{display:flex;align-items:center;gap:8px;margin:12px 0 6px;flex-wrap:wrap}
  .mark{
    background:var(--panel2);border:1px solid var(--line);color:var(--sub);
    padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:7px;
  }
  .mark:hover{color:var(--txt);border-color:#3a434f}
  .mark.on{background:rgba(92,225,166,.12);border-color:var(--sel);color:var(--sel)}
  .mark .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
  .mark.on .dot{opacity:1}

  .ghost{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    padding:8px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;
  }
  .ghost:hover{color:var(--txt);border-color:#3a434f}

  h2{font-size:16px;font-weight:800;margin:22px 0 4px}
  .hint{color:var(--dim);font-size:12.5px;margin-bottom:14px}

  .chbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .chbtn{
    position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 10px 12px;cursor:pointer;font-family:inherit;text-align:left;
    color:var(--sub);transition:.13s;display:flex;flex-direction:column;gap:3px;min-height:66px;
  }
  .chbtn:hover{border-color:#3a434f;background:#161a20}
  .chbtn:active{transform:scale(.975)}
  .chbtn .cn{font-size:19px;font-weight:800;line-height:1;color:var(--dim);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .chbtn .ct{font-size:12.5px;font-weight:700;color:var(--sub);line-height:1.35}
  .chbtn .cs{font-size:10.5px;color:#4d5765;line-height:1.2}
  .chbtn.on{background:rgba(255,208,56,.11);border-color:var(--acc)}
  .chbtn.on .cn{color:var(--acc)}
  .chbtn.on .ct{color:var(--txt)}
  .chbtn.on .cs{color:#8a7434}
  .chbtn.picked{background:rgba(92,225,166,.10);border-color:var(--sel)}
  .chbtn.picked .cn{color:var(--sel)}
  .chbtn.picked .ct{color:var(--txt)}
  .chbtn .tick{
    position:absolute;top:8px;right:8px;width:17px;height:17px;border-radius:50%;
    border:1.5px solid #39424f;display:none;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#0a0c0f;line-height:1;
  }
  .picking .chbtn .tick{display:flex}
  .chbtn.picked .tick{background:var(--sel);border-color:var(--sel)}
  .chbtn .ord{
    position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:800;color:var(--sel);
    display:none;font-variant-numeric:tabular-nums;
  }
  .picking .chbtn.picked .ord{display:block}
  .picking .chbtn.picked .tick{display:none}

  /* 하단 실행 바 */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(12,15,19,.96);border-top:1px solid var(--line);
    padding:12px 20px;display:none;align-items:center;gap:12px;
    backdrop-filter:blur(8px);
  }
  .dock.show{display:flex}
  .dock .cnt{font-size:12.5px;color:var(--sub);flex:1;min-width:0}
  .dock .cnt b{color:var(--sel);font-weight:800}
  .dock .cnt span{display:block;color:var(--dim);font-size:11.5px;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .go{
    background:var(--sel);color:#06231a;border:none;border-radius:9px;
    padding:12px 20px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
    white-space:nowrap;
  }
  .go:disabled{background:#2a333d;color:#5d6878;cursor:default}
  .go.stop{background:#e5534b;color:#fff}

  .repeat{
    display:flex;gap:5px;align-items:center;
  }
  .rbtn{
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    width:34px;height:34px;border-radius:7px;font-size:12px;font-weight:800;
    cursor:pointer;font-family:inherit;
  }
  .rbtn.on{background:var(--acc);border-color:var(--acc);color:#0a0c0f}

  footer{border-top:1px solid var(--line);padding-top:18px;margin-top:34px;color:var(--dim);font-size:12px}

  @media(max-width:760px){
    h1{font-size:25px}
    .parts{grid-template-columns:1fr}
    .chbtns{grid-template-columns:repeat(2,1fr)}
    .wrap{padding-left:14px;padding-right:14px}
    .player{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
    .dock{padding:11px 14px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">율동 연습 · 구분동작</div>
  <h1>세상은 평화 원하지만</h1>
  <div class="sub">파트 1 · 파트 2 — 각 16개 구분동작 · 정속 → 0.75배 → 되짚기</div>
</header>

<div class="parts">
  <button class="pbtn on" data-part="1">
    <span class="big">1</span>
    <span><span class="pt">파트 1</span><span class="pm">8분 19초 · 16개 동작</span></span>
  </button>
  <button class="pbtn" data-part="2">
    <span class="big">2</span>
    <span><span class="pt">파트 2</span><span class="pm">7분 32초 · 16개 동작</span></span>
  </button>
</div>

<div class="player">
  <div class="pmeta">
    <span class="now" id="nowLabel">파트 1 · 01 박수 · 팔 위로</span>
    <span class="nm" id="nowTime">0:00 / 8:19</span>
  </div>
  <video id="vid" controls preload="metadata" playsinline src="videos/part1_horizontal.mp4"></video>
</div>

<div class="bar">
  <button class="mark" id="markBtn"><span class="dot"></span>여러 개 선택</button>
  <button class="ghost" id="allBtn">전체 선택</button>
  <button class="ghost" id="clrBtn">선택 해제</button>
</div>

<h2>구분동작</h2>
<p class="hint" id="hintText">버튼을 누르면 그 동작으로 이동해 재생합니다.</p>
<div class="chbtns" id="chapters"></div>

<footer>
  세상은 평화 원하지만 · 율동 연습용 · 무단 배포 금지
</footer>

</div>

<div class="dock" id="dock">
  <div class="cnt">
    <b id="dockCnt">0개 선택</b>
    <span id="dockList">동작을 선택하세요</span>
  </div>
  <div class="repeat" id="repeatBox">
    <button class="rbtn on" data-rep="1" title="1회">1</button>
    <button class="rbtn" data-rep="2" title="2회">2</button>
    <button class="rbtn" data-rep="3" title="3회">3</button>
    <button class="rbtn" data-rep="0" title="반복">∞</button>
  </div>
  <button class="go" id="goBtn">연속 재생</button>
</div>

<script>
/* start / end = 마스터 영상 안에서 그 구분동작이 차지하는 구간(초) */
const DATA = {
  '1': {
    file:'videos/part1_horizontal.mp4', dur:498.625, label:'파트 1',
    chapters:[
      [1,'박수 · 팔 위로','인트로',1.583,52.625],
      [2,'팔 내리고 스텝','1절',52.625,78.958],
      [3,'제자리 스텝','1절',78.958,105.292],
      [4,'두 손 가슴으로','프리코러스',105.292,131.625],
      [5,'가슴 앞 원 그리기','후렴',131.625,157.958],
      [6,'손 앞으로 내밀기','후렴',157.958,184.292],
      [7,'팔 좌우로 벌리기','후렴',184.292,210.625],
      [8,'팔 흔들며 스텝','후렴',210.625,236.958],
      [9,'팔 벌려 좌우 이동','간주',236.958,288.0],
      [10,'손 모아 앞으로','간주',288.0,314.333],
      [11,'고개 기울여 손 모으기','2절',314.333,340.667],
      [12,'두 손 앞으로 뻗기','2절',340.667,367.0],
      [13,'손 가슴으로 모으기','프리코러스',367.0,393.333],
      [14,'무릎 들기 · 발차기','후렴',393.333,419.667],
      [15,'무릎 들고 손 흔들기','후렴',419.667,446.0],
      [16,'어깨동무 · 마무리','엔딩',446.0,498.625]
    ]
  },
  '2': {
    file:'videos/part2_horizontal.mp4', dur:452.1, label:'파트 2',
    chapters:[
      [1,'입장 · 손 흔들기','인트로',1.6,28.067],
      [2,'제자리 스텝 · 팔 앞뒤','1절',28.067,54.633],
      [3,'한쪽 발 들기','1절',54.633,81.1],
      [4,'양팔 위로 · 가리키기','1절',81.1,107.667],
      [5,'옆으로 이동 · 팔 펼치기','후렴',107.667,134.133],
      [6,'합장 · 무릎 들기','후렴',134.133,160.6],
      [7,'어깨동무 · 좌우 흔들','후렴',160.6,187.167],
      [8,'빠른 스텝 · 팔 펌프','간주',187.167,213.633],
      [9,'한팔 위로 · 옆구리','간주',213.633,240.2],
      [10,'던지기 동작','2절',240.2,266.667],
      [11,'양손 볼에 대기','2절',266.667,293.133],
      [12,'손 흔들며 비 내리기','2절',293.133,319.633],
      [13,'큰 원 그리기','2절',319.633,346.1],
      [14,'양손 엄지 앞으로','2절',346.1,372.567],
      [15,'발차기 · 균형','후렴2',372.567,399.133],
      [16,'무릎 꿇기 · 마무리','엔딩',399.133,452.1]
    ]
  }
};

const vid       = document.getElementById('vid');
const chapters  = document.getElementById('chapters');
const nowLabel  = document.getElementById('nowLabel');
const nowTime   = document.getElementById('nowTime');
const markBtn   = document.getElementById('markBtn');
const allBtn    = document.getElementById('allBtn');
const clrBtn    = document.getElementById('clrBtn');
const dock      = document.getElementById('dock');
const dockCnt   = document.getElementById('dockCnt');
const dockList  = document.getElementById('dockList');
const goBtn     = document.getElementById('goBtn');
const hintText  = document.getElementById('hintText');

let part    = '1';
let activeNo = 1;
let picking = false;
let sel     = [];        // 선택된 동작 번호 (선택 순서 유지)
let repeat  = 1;         // 0 = 무한

/* ── 연속 재생 상태 ── */
let running = false;     // 연속 재생 중
let queue   = [];        // [{no, start, end}]
let qi      = 0;         // 현재 큐 인덱스
let round   = 1;         // 현재 회차

const pad  = n => String(n).padStart(2,'0');
const mmss = s => { s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+pad(s%60); };
const chap = no => DATA[part].chapters.find(c=>c[0]===no);

function chapterAt(t){
  const list = DATA[part].chapters;
  let found = list[0][0];
  for (const c of list){ if (t >= c[3]-0.05) found = c[0]; }
  return found;
}

function setActive(no){
  if (!running && no === activeNo) return;
  activeNo = no;
  document.querySelectorAll('.chbtn').forEach(b=>{
    b.classList.toggle('on', Number(b.dataset.no) === no);
  });
  const c = chap(no);
  if (c){
    const tag = running ? '▶ 연속 ' : '';
    nowLabel.textContent = tag + DATA[part].label + ' · ' + pad(c[0]) + ' ' + c[1];
  }
}

/* ── 렌더 ── */
function render(){
  const d = DATA[part];
  vid.src = d.file;
  sel = [];
  running = false; queue = [];

  chapters.innerHTML = d.chapters.map(([no,title,sec,st,en])=>`
    <button class="chbtn" data-no="${no}" type="button">
      <span class="tick">✓</span>
      <span class="ord"></span>
      <span class="cn">${pad(no)}</span>
      <span class="ct">${title}</span>
      <span class="cs">${sec} · ${mmss(st)}</span>
    </button>`).join('');

  activeNo = -1;
  setActive(d.chapters[0][0]);
  nowTime.textContent = '0:00 / ' + mmss(d.dur);
  syncPicking();
  syncDock();
}

function syncPicking(){
  document.body.classList.toggle('picking', picking);
  markBtn.classList.toggle('on', picking);
  markBtn.lastChild.textContent = picking ? '선택 중' : '여러 개 선택';
  hintText.textContent = picking
    ? '동작을 눌러 담으세요. 담은 순서대로 연속 재생됩니다.'
    : '버튼을 누르면 그 동작으로 이동해 재생합니다.';
}

function syncDock(){
  document.querySelectorAll('.chbtn').forEach(b=>{
    const no = Number(b.dataset.no);
    const i = sel.indexOf(no);
    b.classList.toggle('picked', i >= 0);
    b.querySelector('.ord').textContent = i >= 0 ? (i+1) : '';
  });

  const has = sel.length > 0;
  dock.classList.toggle('show', picking || has);
  dockCnt.textContent = sel.length + '개 선택';

  if (has){
    const names = sel.slice(0,3).map(n=>{ const c=chap(n); return pad(n)+' '+c[1]; }).join(' · ');
    dockList.textContent = sel.length > 3 ? names + ' 외 ' + (sel.length-3) + '개' : names;
  } else {
    dockList.textContent = picking ? '동작을 선택하세요' : '';
  }

  goBtn.disabled = !has;
  goBtn.textContent = running ? '정지' : '연속 재생';
  goBtn.classList.toggle('stop', running);
}

/* ── 선택 토글 ── */
chapters.addEventListener('click', e=>{
  const btn = e.target.closest('.chbtn');
  if (!btn) return;
  const no = Number(btn.dataset.no);

  if (picking){
    const i = sel.indexOf(no);
    if (i >= 0) sel.splice(i,1); else sel.push(no);
    syncDock();
    return;
  }
  jumpTo(no);
});

function jumpTo(no){
  const c = chap(no);
  if (!c) return;
  stopSeq(false);
  const go = ()=>{
    try { vid.currentTime = c[3]; } catch(_){}
    const p = vid.play();
    if (p && p.catch) p.catch(()=>{});
    setActive(no);
  };
  if (vid.readyState >= 1) go();
  else vid.addEventListener('loadedmetadata', go, {once:true});
}

markBtn.onclick = ()=>{
  picking = !picking;
  if (!picking){ /* 선택 모드 종료 시 선택은 유지 */ }
  syncPicking(); syncDock();
};
allBtn.onclick = ()=>{
  picking = true;
  sel = DATA[part].chapters.map(c=>c[0]);
  syncPicking(); syncDock();
};
clrBtn.onclick = ()=>{
  sel = []; stopSeq(true); syncDock();
};

document.querySelectorAll('.rbtn').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.rbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    repeat = Number(b.dataset.rep);
  };
});

/* ── 연속 재생 ── */
goBtn.onclick = ()=>{
  if (running){ stopSeq(true); return; }
  if (!sel.length) return;

  queue = sel.map(no=>{
    const c = chap(no);
    return {no, start:c[3], end:c[4], title:c[1]};
  });
  qi = 0; round = 1; running = true;
  picking = false;
  syncPicking(); syncDock();
  playCurrent();
};

function playCurrent(){
  if (!running) return;
  const q = queue[qi];
  if (!q) return;

  nowLabel.textContent = '▶ 연속 ' + DATA[part].label + ' · ' + pad(q.no) + ' ' + q.title
    + (repeat ? '  ('+round+'/'+repeat+')' : '');
  document.querySelectorAll('.chbtn').forEach(b=>{
    b.classList.toggle('on', Number(b.dataset.no) === q.no);
  });

  const start = ()=>{
    try { vid.currentTime = q.start; } catch(_){}
    const p = vid.play();
    if (p && p.catch) p.catch(()=>{});
  };
  if (vid.readyState >= 1) start();
  else vid.addEventListener('loadedmetadata', start, {once:true});
}

function nextInQueue(){
  qi++;
  if (qi >= queue.length){
    qi = 0; round++;
    if (repeat && round > repeat){ stopSeq(true); return; }
  }
  playCurrent();
}

function stopSeq(seekBack){
  const wasRunning = running;
  running = false;
  queue = []; qi = 0; round = 1;
  if (wasRunning){ try { vid.pause(); } catch(_){} }
  syncDock();
  if (seekBack && sel.length) setActive(chapterAt(vid.currentTime));
}

/* 재생 위치 감시 — 구간 끝에 닿으면 다음 동작으로 */
vid.addEventListener('timeupdate', ()=>{
  const t = vid.currentTime;

  if (running){
    const q = queue[qi];
    if (q && t >= q.end - 0.06){
      try { vid.pause(); } catch(_){}
      nextInQueue();
      return;
    }
  } else {
    setActive(chapterAt(t));
  }
  nowTime.textContent = mmss(t) + ' / ' + mmss(DATA[part].dur);
});

/* 사용자가 직접 다른 곳을 누르면 연속 재생 해제 */
vid.addEventListener('seeking', ()=>{
  if (!running) return;
  const q = queue[qi];
  if (!q) return;
  if (vid.currentTime < q.start - 1.0 || vid.currentTime > q.end + 1.0){
    stopSeq(false);
  }
});

document.querySelectorAll('.pbtn').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.pbtn').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    part = t.dataset.part;
    render();
  };
});

render();
</script>
</body>
</html>
